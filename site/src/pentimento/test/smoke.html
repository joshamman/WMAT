<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pentimento — smoke test</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;color:#21241F;background:#EDEEEA}
  header{padding:16px 20px;border-bottom:1px solid #D8DAD3}
  h1{font-size:18px;margin:0}
  #banner{font-weight:700;font-size:15px;margin-top:6px}
  #out{padding:16px 20px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap}
  .pass{color:#2F6B5A}.fail{color:#C7362B}
  /* the app under test — give it a real box so canvas/scrubber have non-zero width */
  #app{position:fixed;right:12px;bottom:12px;width:420px;height:560px;border:1px solid #D8DAD3;border-radius:10px;background:#fff;transform:scale(.9);transform-origin:bottom right}
</style>
</head>
<body>
<header>
  <h1>Pentimento smoke test <span style="font-weight:400;color:#6E7268">— regression net (HANDOFF §1.3)</span></h1>
  <div id="banner">running…</div>
</header>
<pre id="out"></pre>
<iframe id="app" title="app under test"></iframe>

<script>
/* Drives the REAL app (../index.html) through the actual user path and asserts on its
   live DOM. Serve the repo over http and open /test/smoke.html — file:// blocks the
   fetch() of the sample below. (?target=<file> can point at another html entry.) */
'use strict';
const results = [];
const check = (name, cond, detail = '') => results.push({ name, pass: !!cond, detail });
const fmt = (ms) => { ms = Math.max(0, ms | 0); const s = Math.floor(ms / 1000), m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); };
const until = (fn, ms, label) => new Promise((res, rej) => {
  const t0 = Date.now(); (function poll() {
    let ok = false; try { ok = fn(); } catch (_) {}
    if (ok) return res();
    if (Date.now() - t0 > ms) return rej(new Error('timeout waiting for ' + label));
    setTimeout(poll, 30);
  })();
});

function report() {
  const pass = results.every((r) => r.pass);
  const out = document.getElementById('out');
  out.innerHTML = results.map((r) =>
    `<span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'}</span>  ${r.name}` +
    (r.detail ? `  <span style="color:#6E7268">— ${String(r.detail).replace(/</g, '&lt;')}</span>` : '')
  ).join('\n');
  const banner = document.getElementById('banner');
  banner.textContent = pass ? `ALL ${results.length} CHECKS PASSED` : `FAILED (${results.filter((r) => !r.pass).length}/${results.length})`;
  banner.className = pass ? 'pass' : 'fail';
  document.title = (pass ? 'PASS' : 'FAIL') + ' — Pentimento smoke test';
  window.__SMOKE__ = { pass, results };            // read by the CI/agent harness
  console.log('[smoke]', JSON.stringify(window.__SMOKE__));
}

const target = new URLSearchParams(location.search).get('target') || 'index.html';
const frame = document.getElementById('app');
frame.addEventListener('load', async () => {
  try {
    const win = frame.contentWindow, doc = frame.contentDocument;
    await until(() => typeof win.openReview === 'function', 4000, 'app boot (openReview)');
    await until(() => typeof win.d3 !== 'undefined', 4000, 'd3 load');

    const sample = await (await fetch('../samples/sample.json')).json();
    // inject straight into the app's storage (standalone => localStorage, key = K_S(id))
    win.localStorage.setItem('pentimento-session-' + sample.id, JSON.stringify(sample));
    await win.openReview(sample.id);
    await until(() => doc.querySelectorAll('#charts .chart').length > 0, 4000, 'charts render');

    const dur = sample.durationMs; // analyze() recomputes to the same value for this fixture

    // 1 — stat cards populate
    const stats = doc.querySelectorAll('#stats .stat');
    check('stat cards populate (8)', stats.length === 8, stats.length + ' cards');
    const total = stats[0] && stats[0].querySelector('.v').textContent.trim();
    check('“Total time” card shows ' + fmt(dur), total && total.startsWith(fmt(dur)), 'card = ' + total);

    // 2 — all five charts render (sample is a Pencil session with pauses, so none no-op)
    const charts = doc.querySelectorAll('#charts .chart');
    const svgs = doc.querySelectorAll('#charts svg');
    check('all five charts render', charts.length === 5 && svgs.length === 5, charts.length + ' chart blocks / ' + svgs.length + ' svg');

    // 3 — replay reaches 100%
    win.seek(dur);
    const clock = doc.querySelector('#clock').textContent.trim();
    check('replay reaches 100%', clock === fmt(dur) + ' / ' + fmt(dur), 'clock = "' + clock + '"');

    // 4 — note tooltip opens on tapping a pin
    const pin = doc.querySelector('#pins > g');
    check('note pins drawn on scrubber', !!pin);
    if (pin) {
      pin.dispatchEvent(new win.PointerEvent('pointerdown', { bubbles: true, cancelable: true }));
      const tip = doc.querySelector('#note-tip');
      const txt = tip.querySelector('.tt-text').textContent;
      const known = sample.notes.map((n) => n.text);
      check('note tooltip opens with the note text', tip.style.display === 'block' && known.includes(txt), 'display=' + tip.style.display + ' text="' + txt + '"');
    }
  } catch (e) {
    check('harness ran without error', false, (e && e.stack) || String(e));
  }
  report();
});
frame.src = '../' + target;
</script>
</body>
</html>
